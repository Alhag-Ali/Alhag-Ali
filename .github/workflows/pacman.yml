name: Generate Pac-Man Contribution Graph

on:
  # Aktion automatisch alle 12 Stunden ausführen
  schedule:
    - cron: '0 */12 * * *'
  # Erlaube manuelles Starten (wichtig für den ersten Lauf)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pac-Man Graph

    steps:
      - uses: actions/checkout@v3

      # Dies ist die Aktion, die das Pac-Man-SVG generiert
      - uses: ashutosh00710/github-readme-pacman@main
        with:
          # Token wird benötigt, um deine Aktivitäten zu lesen
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Name des Branches, in den die Bilder geschoben werden
          # (Wir verwenden 'output', um deinem Beispiel zu folgen)
          PACMAN_GRAPH_BRANCH: output
          
          # Auch die dunkle Version erstellen
          PACMAN_DARK_MODE: true
