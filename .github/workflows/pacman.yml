name: Generate Pac-Man Contribution Graph
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pac-Man Graph
    steps:
      - uses: actions/checkout@v3
      - uses: ashutosh00710/github-readme-pacman@v2.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_BRANCH: main
